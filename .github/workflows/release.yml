name: Release candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full reviewed immutable commit SHA on main (versions already prepared)
        type: string
        required: true
      publish:
        description: Publish the exact tested wheels to PyPI (protected environment required)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: python-release-promotion
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.12.5
          python-version: 3.14.8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.8'
      - name: Reject ineligible candidate before validation or credentials
        id: resolve
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
        run: |
          SHA=$(./scripts/gate.py resolve --candidate "$CANDIDATE")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  validate:
    needs: resolve
    uses: ./.github/workflows/test.yml
    with:
      candidate_sha: ${{ needs.resolve.outputs.sha }}

  promotion-check:
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.12.5
          python-version: 3.14.8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.8'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: proof-*
          path: ${{ runner.temp }}/downloaded
      - name: Verify complete same-SHA proof and exact bytes without publication
        env:
          CANDIDATE: ${{ needs.resolve.outputs.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/proof"
          for mode in offline package odoo18; do
            cp -R "$RUNNER_TEMP/downloaded/proof-$mode" "$RUNNER_TEMP/proof/$mode"
          done
          ./scripts/gate.py promote --candidate "$CANDIDATE" --artifacts "$RUNNER_TEMP/candidate" --proof "$RUNNER_TEMP/proof"

  publish:
    needs: [resolve, validate, promotion-check]
    if: ${{ inputs.publish }}
    environment: pypi
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.12.5
          python-version: 3.14.8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.8'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: proof-*
          path: ${{ runner.temp }}/downloaded
      - name: Verify again inside protected promotion boundary, then publish tested bytes
        env:
          CANDIDATE: ${{ needs.resolve.outputs.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/proof"
          for mode in offline package odoo18; do
            cp -R "$RUNNER_TEMP/downloaded/proof-$mode" "$RUNNER_TEMP/proof/$mode"
          done
          ./scripts/gate.py promote --candidate "$CANDIDATE" --artifacts "$RUNNER_TEMP/candidate" --proof "$RUNNER_TEMP/proof"
          uv publish --trusted-publishing always "$RUNNER_TEMP/candidate/"*.whl
