name: Release candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full reviewed immutable commit SHA on main (versions already prepared)
        type: string
        required: true
      publish:
        description: Publish the exact tested wheels to PyPI (protected environment required)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: python-release-promotion
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Reject ineligible candidate before validation or credentials
        id: resolve
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
        run: |
          SHA=$(./scripts/gate.py resolve --candidate "$CANDIDATE")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  validate:
    needs: resolve
    uses: ./.github/workflows/test.yml
    with:
      candidate_sha: ${{ needs.resolve.outputs.sha }}

  promotion-check:
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: proof-*
          path: ${{ runner.temp }}/downloaded
      - name: Verify complete same-SHA proof and exact bytes without publication
        env:
          CANDIDATE: ${{ needs.resolve.outputs.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/proof"
          for mode in offline package odoo18; do
            cp -R "$RUNNER_TEMP/downloaded/proof-$mode" "$RUNNER_TEMP/proof/$mode"
          done
          ./scripts/gate.py promote --candidate "$CANDIDATE" --artifacts "$RUNNER_TEMP/candidate" --proof "$RUNNER_TEMP/proof"

  publish:
    needs: [resolve, validate, promotion-check]
    if: ${{ inputs.publish }}
    environment: pypi
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: proof-*
          path: ${{ runner.temp }}/downloaded
      - name: Verify again inside protected promotion boundary, then publish tested bytes
        env:
          CANDIDATE: ${{ needs.resolve.outputs.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/proof"
          for mode in offline package odoo18; do
            cp -R "$RUNNER_TEMP/downloaded/proof-$mode" "$RUNNER_TEMP/proof/$mode"
          done
          ./scripts/gate.py promote --candidate "$CANDIDATE" --artifacts "$RUNNER_TEMP/candidate" --proof "$RUNNER_TEMP/proof"
          uv publish --trusted-publishing always "$RUNNER_TEMP/candidate/"*.whl
