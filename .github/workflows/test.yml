name: Test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      qualify19:
        description: Explicitly qualify Odoo19 after the same candidate passes Odoo18
        type: boolean
        default: false
  workflow_call:
    inputs:
      candidate_sha:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.12.5
          python-version: 3.14.8
      - run: ./scripts/check.py offline --evidence "$RUNNER_TEMP/proof/offline"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: proof-offline
          path: ${{ runner.temp }}/proof/offline
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.12.5
          python-version: 3.14.8
      - run: ./scripts/check.py package --artifacts "$RUNNER_TEMP/candidate" --evidence "$RUNNER_TEMP/proof/package"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: proof-package
          path: ${{ runner.temp }}/proof/package
          if-no-files-found: error

  odoo18:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.12.5
          python-version: 3.14.8
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate
      - run: ./scripts/check.py odoo18 --artifacts "$RUNNER_TEMP/candidate" --evidence "$RUNNER_TEMP/proof/odoo18"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: proof-odoo18
          path: ${{ runner.temp }}/proof/odoo18
          if-no-files-found: error

  required:
    name: required
    needs: [offline, package, odoo18, odoo19]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.12.5
          python-version: 3.14.8
      - name: Require every mandatory result
        env:
          RESULTS: ${{ toJSON(needs) }}
          REQUESTED19: ${{ inputs.qualify19 == true }}
        run: ./scripts/gate.py required

  odoo19:
    needs: [offline, package, odoo18]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualify19 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.12.5
          python-version: 3.14.8
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: proof-odoo18
          path: ${{ runner.temp }}/proof/odoo18
      - run: ./scripts/check.py odoo19 --artifacts "$RUNNER_TEMP/candidate" --evidence "$RUNNER_TEMP/proof/odoo19" --baseline18 "$RUNNER_TEMP/proof/odoo18"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: proof-odoo19
          path: ${{ runner.temp }}/proof/odoo19
          if-no-files-found: error
