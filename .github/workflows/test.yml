name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      qualify19:
        description: Explicitly qualify Odoo19 after the same candidate passes Odoo18
        type: boolean
        default: false
  workflow_call:
    inputs:
      candidate_sha:
        type: string
        required: true

permissions:
  contents: read

# Only a newer push to the same PR cancels a run; main, manual and release runs
# (workflow_call) each get their own group.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: ./scripts/check.py offline --evidence "$RUNNER_TEMP/proof/offline"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: proof-offline
          path: ${{ runner.temp }}/proof/offline
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: ./scripts/check.py package --artifacts "$RUNNER_TEMP/candidate" --evidence "$RUNNER_TEMP/proof/package"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: proof-package
          path: ${{ runner.temp }}/proof/package
          if-no-files-found: error

  odoo18:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate
      - run: ./scripts/check.py odoo18 --artifacts "$RUNNER_TEMP/candidate" --evidence "$RUNNER_TEMP/proof/odoo18"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: proof-odoo18
          path: ${{ runner.temp }}/proof/odoo18
          if-no-files-found: error

  required:
    name: required
    needs: [offline, package, odoo18, odoo19]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Require every mandatory result
        env:
          RESULTS: ${{ toJSON(needs) }}
          REQUESTED19: ${{ inputs.qualify19 == true }}
        run: ./scripts/gate.py required

  odoo19:
    needs: [offline, package, odoo18]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualify19 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proof-odoo18
          path: ${{ runner.temp }}/proof/odoo18
      - run: ./scripts/check.py odoo19 --artifacts "$RUNNER_TEMP/candidate" --evidence "$RUNNER_TEMP/proof/odoo19" --baseline18 "$RUNNER_TEMP/proof/odoo18"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: proof-odoo19
          path: ${{ runner.temp }}/proof/odoo19
          if-no-files-found: error
