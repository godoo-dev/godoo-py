name: Prepare version changes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.12.5
          python-version: 3.14.8
      - run: uv sync --frozen --all-packages --all-extras
      - name: Prepare coordinated versions and changelog; no commit, tag, push or publication
        run: |
          uv run --frozen semantic-release version --no-commit --no-tag --no-push --no-vcs-release --skip-build
          uv lock
          git diff HEAD --binary > "$RUNNER_TEMP/version-preparation.patch"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: version-preparation-for-review
          path: ${{ runner.temp }}/version-preparation.patch
          if-no-files-found: error
