name: Prepare version changes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --all-packages --all-extras
      - name: Prepare coordinated versions and changelog; no commit, tag, push or publication
        run: |
          uv run --frozen semantic-release version --no-commit --no-tag --no-push --no-vcs-release --skip-build
          uv lock
          git diff HEAD --binary > "$RUNNER_TEMP/version-preparation.patch"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: version-preparation-for-review
          path: ${{ runner.temp }}/version-preparation.patch
          if-no-files-found: error
