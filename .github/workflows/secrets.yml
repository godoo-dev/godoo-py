# DEBT-02: run_spike.py was never committed (commit 67200b8). This workflow guards against
# future committed credentials. No .gitleaks.toml needed — spikes/ and infra/ contain only
# placeholder strings verified clean 2026-06-03.
name: Secrets Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
