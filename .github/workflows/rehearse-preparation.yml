# Validation-only driver: no tags, pushes, releases, publication or deployments.
name: Nonpublishing version rehearsal
on:
  pull_request:
    branches: ['validate/hosted-cicd-20261024']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.12.5
          python-version: 3.14.8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.8'
      - run: uv sync --frozen --all-packages --all-extras
      - name: Confirm this PR cannot enter release promotion
        run: |
          if ./scripts/gate.py resolve --candidate "$(git rev-parse HEAD)" > "$RUNNER_TEMP/guard.log" 2>&1; then exit 1; fi
          cat "$RUNNER_TEMP/guard.log"
      - name: Exercise native version preparation on a runner-local main branch
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/head-before"
          git show-ref --tags > "$RUNNER_TEMP/tags-before" || true
          git checkout -B main HEAD
          uv run --frozen semantic-release version --no-commit --no-tag --no-push --no-vcs-release --skip-build
          uv lock
      - name: Retain reviewable patch and prove no commits or tags were created
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/head-after"
          git show-ref --tags > "$RUNNER_TEMP/tags-after" || true
          diff "$RUNNER_TEMP/head-before" "$RUNNER_TEMP/head-after"
          diff "$RUNNER_TEMP/tags-before" "$RUNNER_TEMP/tags-after"
          git diff HEAD --binary > "$RUNNER_TEMP/version-preparation.patch"
          test -s "$RUNNER_TEMP/version-preparation.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nonpublishing-preparation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/version-preparation.patch
            ${{ runner.temp }}/guard.log
          if-no-files-found: error
